name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    name: C++ (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-all-dev ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/ci-cpp -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DPARTICLES_ENABLE_CUDA=OFF
      - name: Build
        run: cmake --build build/ci-cpp --parallel 2
      - name: Test
        run: ctest --test-dir build/ci-cpp --output-on-failure
      - name: Run CPU smoke experiments
        run: |
          ./build/ci-cpp/particles_cli smoke
          ./build/ci-cpp/particles_cli equilibrium \
            configs/equilibrium.json \
            build/ci-equilibrium
          ./build/ci-cpp/particles_cli shock-tube \
            configs/shock_tube_smoke.json \
            build/ci-shock-tube

  sanitizer:
    name: ASan and UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-all-dev ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/ci-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DPARTICLES_ENABLE_CUDA=OFF
          "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build/ci-sanitize --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build/ci-sanitize --output-on-failure

  python:
    name: Python diagnostics
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-visualization.txt
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements-visualization.txt
      - name: Compile scripts
        run: python -m py_compile tools/*.py
      - name: Validate Euler reference
        run: >
          python tools/euler_reference.py
          --self-test
          --grid-check
          configs/shock_tube.json
      - name: Validate Enskog-Euler reference
        run: |
          python tools/enskog_reference.py --self-test configs/shock_tube.json
          python tools/analyze_enskog_comparison.py --self-test
      - name: Validate Enskog Navier-Stokes-Fourier reference
        run: |
          python tools/enskog_nsf_reference.py --self-test configs/shock_tube.json
          python tools/analyze_enskog_nsf_comparison.py --self-test
          python tools/analyze_enskog_transport_ablation.py --self-test
          python tools/analyze_enskog_transport_evolution.py --self-test
      - name: Validate wave-marker extraction
        run: python tools/analyze_wave_kinematics.py --self-test
      - name: Validate multi-seed statistics
        run: python tools/analyze_multiseed_fields.py --self-test
      - name: Validate particle-count/Knudsen scan
        run: |
          python tools/run_n_kn_scan.py --self-test
          python tools/analyze_n_kn_scan.py --self-test

  visualization:
    name: End-to-end visualization smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-visualization.txt
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libboost-all-dev ninja-build
          python -m pip install --requirement requirements-visualization.txt
      - name: Build CPU runner
        run: |
          cmake -S . -B build/ci-visualization -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DPARTICLES_ENABLE_CUDA=OFF
          cmake --build build/ci-visualization --parallel 2
      - name: Generate smoke diagnostics
        run: >
          ./build/ci-visualization/particles_cli shock-tube
          configs/shock_tube_smoke.json
          build/ci-visualization-data
      - name: Render synchronized views
        run: >
          python tools/visualize_shock_tube.py
          build/ci-visualization-data
          --config configs/shock_tube_smoke.json
          --output build/ci-visualization-output
          --dpi 30
          --no-video
      - name: Check generated artifacts
        run: |
          test -s build/ci-visualization-output/final-overview.png
          test -s build/ci-visualization-output/macroscopic-evolution.png
          test -s build/ci-visualization-output/euler-reference.csv
          test -s build/ci-visualization-output/euler-comparison.csv
          test -s build/ci-visualization-output/manifest.json
      - name: Run independent-seed smoke batch
        run: >
          python tools/run_multiseed_shock_tube.py
          configs/shock_tube_multiseed_smoke.json
          --executable build/ci-visualization/particles_cli
          --output build/ci-multiseed
      - name: Build multi-seed confidence bands
        run: >
          python tools/analyze_multiseed_fields.py
          configs/shock_tube_multiseed_smoke.json
          build/ci-multiseed
      - name: Check multi-seed artifacts
        run: |
          test -s build/ci-multiseed/batch-summary.json
          test -s build/ci-multiseed/statistics/field-bands.csv
          test -s build/ci-multiseed/statistics/frame-summary.csv
          test -s build/ci-multiseed/statistics/summary.json
          test -s build/ci-multiseed/statistics/final-field-bands.png
      - name: Run particle-count/Knudsen smoke scan
        run: >
          python tools/run_n_kn_scan.py
          configs/shock_tube_n_kn_scan_smoke.json
          --executable build/ci-visualization/particles_cli
          --output build/ci-n-kn-scan
      - name: Analyze particle-count/Knudsen smoke scan
        run: >
          python tools/analyze_n_kn_scan.py
          configs/shock_tube_n_kn_scan_smoke.json
          build/ci-n-kn-scan
      - name: Compare ideal and Enskog-Euler smoke references
        run: >
          python tools/analyze_enskog_comparison.py
          configs/shock_tube_n_kn_scan_smoke.json
          build/ci-n-kn-scan
      - name: Compare Enskog transport smoke reference
        run: >
          python tools/analyze_enskog_nsf_comparison.py
          configs/shock_tube_n_kn_scan_smoke.json
          build/ci-n-kn-scan
          --nsf-cells 128
      - name: Ablate Enskog transport smoke reference
        run: >
          python tools/analyze_enskog_transport_ablation.py
          configs/shock_tube_n_kn_scan_smoke.json
          build/ci-n-kn-scan
          --nsf-cells 128
      - name: Track Enskog transport smoke reference over time
        run: >
          python tools/analyze_enskog_transport_evolution.py
          configs/shock_tube_n_kn_scan_smoke.json
          build/ci-n-kn-scan
          --nsf-cells 128
      - name: Check particle-count/Knudsen artifacts
        run: |
          test -s build/ci-n-kn-scan/scan-manifest.csv
          test -s build/ci-n-kn-scan/scan-summary.json
          test -s build/ci-n-kn-scan/analysis/cell-summary.csv
          test -s build/ci-n-kn-scan/analysis/field-scan.csv
          test -s build/ci-n-kn-scan/analysis/trend-summary.csv
          test -s build/ci-n-kn-scan/analysis/summary.json
          test -s build/ci-n-kn-scan/analysis/field-error-scan.png
          test -s build/ci-n-kn-scan/analysis/uncertainty-scaling.png
          test -s build/ci-n-kn-scan/enskog-comparison/field-comparison.csv
          test -s build/ci-n-kn-scan/enskog-comparison/velocity-diagnostics.csv
          test -s build/ci-n-kn-scan/enskog-comparison/reference-grid-check.csv
          test -s build/ci-n-kn-scan/enskog-comparison/summary.json
          test -s build/ci-n-kn-scan/enskog-comparison/enskog-field-comparison.png
          test -s build/ci-n-kn-scan/enskog-comparison/velocity-error-diagnostics.png
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/field-comparison.csv
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/velocity-diagnostics.csv
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/transport-coefficients.csv
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/reference-grid-check.csv
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/summary.json
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/enskog-nsf-field-comparison.png
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/model-error-comparison.png
          test -s build/ci-n-kn-scan/enskog-nsf-comparison/velocity-profile-comparison.png
          test -s build/ci-n-kn-scan/enskog-transport-ablation/field-ablation.csv
          test -s build/ci-n-kn-scan/enskog-transport-ablation/velocity-ablation.csv
          test -s build/ci-n-kn-scan/enskog-transport-ablation/velocity-attribution.csv
          test -s build/ci-n-kn-scan/enskog-transport-ablation/solver-diagnostics.csv
          test -s build/ci-n-kn-scan/enskog-transport-ablation/bulk-increment-grid-check.csv
          test -s build/ci-n-kn-scan/enskog-transport-ablation/summary.json
          test -s build/ci-n-kn-scan/enskog-transport-ablation/transport-ablation-errors.png
          test -s build/ci-n-kn-scan/enskog-transport-ablation/transport-ablation-velocity.png
          test -s build/ci-n-kn-scan/enskog-transport-ablation/velocity-error-attribution.png
          test -s build/ci-n-kn-scan/enskog-transport-evolution/field-evolution.csv
          test -s build/ci-n-kn-scan/enskog-transport-evolution/velocity-evolution.csv
          test -s build/ci-n-kn-scan/enskog-transport-evolution/velocity-shape-evolution.csv
          test -s build/ci-n-kn-scan/enskog-transport-evolution/temporal-summary.csv
          test -s build/ci-n-kn-scan/enskog-transport-evolution/solver-diagnostics.csv
          test -s build/ci-n-kn-scan/enskog-transport-evolution/summary.json
          test -s build/ci-n-kn-scan/enskog-transport-evolution/velocity-error-evolution.png
          test -s build/ci-n-kn-scan/enskog-transport-evolution/field-error-evolution.png
          test -s build/ci-n-kn-scan/enskog-transport-evolution/velocity-shape-evolution.png
