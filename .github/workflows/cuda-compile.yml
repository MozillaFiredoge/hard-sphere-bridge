name: CUDA compile

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 1 * *"

permissions:
  contents: read

jobs:
  cuda:
    name: CUDA 13.3 compile
    runs-on: ubuntu-24.04
    container:
      image: nvidia/cuda:13.3.0-devel-ubuntu24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes \
            cmake \
            g++ \
            git \
            libboost-all-dev \
            ninja-build
      - name: Configure
        run: >
          cmake -S . -B build/ci-cuda -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CUDA_ARCHITECTURES=75
          -DPARTICLES_ENABLE_CUDA=ON
      - name: Build
        run: cmake --build build/ci-cuda --parallel 2
      - name: Run tests without requiring a visible GPU
        run: ctest --test-dir build/ci-cuda --output-on-failure
